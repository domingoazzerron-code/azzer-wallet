<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Wallet Balance Tracker</title>
    <meta name="theme-color" id="themeColorMeta" content="#05070f">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Azzer Wallet">
    <script>try{var t=localStorage.getItem("wallet_theme");if(["light","dark","glass"].indexOf(t)>-1)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ===== THEMES (iOS Liquid Glass): dark (default) / light / glass ===== */
        :root {
            color-scheme: dark;
            --bg: #05070f;
            --bg-image:
                radial-gradient(circle at 15% 6%, rgba(64, 120, 255, 0.38) 0%, transparent 38%),
                radial-gradient(circle at 92% 32%, rgba(150, 80, 255, 0.26) 0%, transparent 40%),
                radial-gradient(circle at 18% 96%, rgba(0, 200, 170, 0.20) 0%, transparent 45%);
            --surface: rgba(30, 34, 56, 0.6);
            --surface-card: rgba(255, 255, 255, 0.07);
            --surface-hover: rgba(255, 255, 255, 0.12);
            --text-main: #ffffff;
            --text-muted: rgba(235, 235, 245, 0.6);
            --border-color: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.14);
            --primary: #0a84ff;
            --primary-variant: #5e5ce6;
            --emerald: #30d158;
            --rose: #ff453a;
            --amber: #ffd60a;
            --shadow-glass: 0 10px 30px rgba(0, 0, 0, 0.35), inset 1px 1px 0 rgba(255, 255, 255, 0.22), inset -1px -1px 0 rgba(255, 255, 255, 0.06), inset 0 0 22px rgba(255, 255, 255, 0.03);
            --shadow-elevation-1: 0 4px 14px rgba(0, 0, 0, 0.25), inset 1px 1px 0 rgba(255, 255, 255, 0.18), inset -1px -1px 0 rgba(255, 255, 255, 0.05);
            --shadow-elevation-2: 0 8px 24px rgba(0, 0, 0, 0.35), inset 1px 1px 0 rgba(255, 255, 255, 0.2);
            --shadow-elevation-3: 0 20px 50px rgba(0, 0, 0, 0.5), inset 1px 1px 0 rgba(255, 255, 255, 0.2);
            --gloss-gradient: none;
            --sheen: linear-gradient(135deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0) 40%, rgba(255, 255, 255, 0) 70%, rgba(255, 255, 255, 0.05) 100%);
            --fill-1: rgba(255, 255, 255, 0.06);
            --fill-2: rgba(255, 255, 255, 0.09);
            --fill-3: rgba(255, 255, 255, 0.12);
            --fill-4: rgba(255, 255, 255, 0.14);
            --fill-5: rgba(255, 255, 255, 0.20);
            --seg-active: rgba(255, 255, 255, 0.18);
            --modal-bg: rgba(28, 32, 54, 0.68);
            --select-bg: #1c2036;
            --overlay-bg: rgba(0, 0, 0, 0.5);
            --toast-bg: rgba(60, 64, 90, 0.7);
            --specular: rgba(255, 255, 255, 0.3);
            --text-shadow: none;
        }

        html[data-theme="light"] {
            color-scheme: light;
            --bg: #eef2fa;
            --bg-image:
                radial-gradient(circle at 10% 5%, rgba(120, 170, 255, 0.55) 0%, transparent 40%),
                radial-gradient(circle at 95% 25%, rgba(255, 170, 210, 0.45) 0%, transparent 42%),
                radial-gradient(circle at 15% 95%, rgba(150, 235, 200, 0.45) 0%, transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(200, 170, 255, 0.40) 0%, transparent 40%);
            --surface: rgba(255, 255, 255, 0.6);
            --surface-card: rgba(255, 255, 255, 0.5);
            --surface-hover: rgba(255, 255, 255, 0.7);
            --text-main: #1c1c1e;
            --text-muted: rgba(60, 60, 67, 0.62);
            --border-color: rgba(60, 60, 67, 0.12);
            --glass-border: rgba(255, 255, 255, 0.75);
            --primary: #007aff;
            --emerald: #248a3d;
            --rose: #d70015;
            --amber: #b26a00;
            --shadow-glass: 0 8px 28px rgba(40, 60, 120, 0.12), 0 0 0 0.5px rgba(60, 60, 67, 0.06), inset 1px 1px 0 rgba(255, 255, 255, 0.9), inset -1px -1px 0 rgba(255, 255, 255, 0.4);
            --shadow-elevation-1: 0 3px 12px rgba(40, 60, 120, 0.10), inset 1px 1px 0 rgba(255, 255, 255, 0.85), inset -1px -1px 0 rgba(255, 255, 255, 0.35);
            --shadow-elevation-2: 0 8px 22px rgba(40, 60, 120, 0.14), inset 1px 1px 0 rgba(255, 255, 255, 0.9);
            --shadow-elevation-3: 0 20px 50px rgba(40, 60, 120, 0.22), inset 1px 1px 0 rgba(255, 255, 255, 0.9);
            --sheen: linear-gradient(135deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0) 45%, rgba(255, 255, 255, 0.18) 100%);
            --fill-1: rgba(120, 120, 128, 0.10);
            --fill-2: rgba(120, 120, 128, 0.12);
            --fill-3: rgba(120, 120, 128, 0.16);
            --fill-4: rgba(120, 120, 128, 0.10);
            --fill-5: rgba(120, 120, 128, 0.22);
            --seg-active: rgba(255, 255, 255, 0.92);
            --modal-bg: rgba(250, 250, 255, 0.78);
            --select-bg: #ffffff;
            --overlay-bg: rgba(20, 30, 60, 0.3);
            --toast-bg: rgba(255, 255, 255, 0.78);
            --specular: rgba(255, 255, 255, 0.9);
        }

        html[data-theme="glass"] {
            color-scheme: dark;
            --bg: #0a0f2e;
            --bg-image:
                radial-gradient(circle at 0% 0%, rgba(58, 123, 255, 0.85) 0%, transparent 45%),
                radial-gradient(circle at 100% 20%, rgba(255, 106, 158, 0.55) 0%, transparent 42%),
                radial-gradient(circle at 90% 100%, rgba(192, 75, 255, 0.75) 0%, transparent 48%),
                radial-gradient(circle at 10% 90%, rgba(0, 224, 192, 0.5) 0%, transparent 45%);
            --surface: rgba(255, 255, 255, 0.14);
            --surface-card: rgba(255, 255, 255, 0.13);
            --surface-hover: rgba(255, 255, 255, 0.2);
            --text-muted: rgba(255, 255, 255, 0.74);
            --border-color: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.32);
            --shadow-glass: 0 10px 34px rgba(0, 0, 0, 0.25), inset 1.5px 1.5px 0 rgba(255, 255, 255, 0.6), inset -1px -1px 0 rgba(255, 255, 255, 0.18), inset 0 0 30px rgba(255, 255, 255, 0.08);
            --shadow-elevation-1: 0 4px 14px rgba(0, 0, 0, 0.18), inset 1px 1px 0 rgba(255, 255, 255, 0.5), inset -1px -1px 0 rgba(255, 255, 255, 0.12);
            --shadow-elevation-2: 0 8px 24px rgba(0, 0, 0, 0.25), inset 1px 1px 0 rgba(255, 255, 255, 0.55);
            --shadow-elevation-3: 0 20px 50px rgba(0, 0, 0, 0.35), inset 1px 1px 0 rgba(255, 255, 255, 0.55);
            --sheen: linear-gradient(135deg, rgba(255, 255, 255, 0.30) 0%, rgba(255, 255, 255, 0.04) 45%, rgba(255, 255, 255, 0.14) 100%);
            --fill-1: rgba(255, 255, 255, 0.13);
            --fill-2: rgba(255, 255, 255, 0.17);
            --fill-3: rgba(255, 255, 255, 0.21);
            --fill-4: rgba(255, 255, 255, 0.25);
            --fill-5: rgba(255, 255, 255, 0.33);
            --seg-active: rgba(255, 255, 255, 0.34);
            --modal-bg: rgba(40, 52, 110, 0.42);
            --select-bg: #1a2250;
            --overlay-bg: rgba(5, 8, 30, 0.35);
            --toast-bg: rgba(255, 255, 255, 0.26);
            --specular: rgba(255, 255, 255, 0.75);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
        body {
            background-color: var(--bg);
            background-image: var(--bg-image);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            touch-action: manipulation;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 20px 40px 20px;
            position: relative;
        }

        .glass-card {
            background: var(--surface-card);
            background-image: var(--gloss-gradient);
            backdrop-filter: blur(24px) saturate(190%);
            -webkit-backdrop-filter: blur(24px) saturate(190%);
            border: 1px solid var(--glass-border);
            border-radius: 26px;
            box-shadow: var(--shadow-glass);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--specular), transparent);
        }

        .net-worth-card {
            position: relative;
            overflow: hidden;
            padding: 18px 18px 16px;
            background: linear-gradient(135deg, rgba(14, 22, 39, 0.92), rgba(29, 39, 78, 0.7));
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 30px;
            box-shadow: 0 18px 38px rgba(8, 12, 26, 0.48), inset 0 1px 0 rgba(255,255,255,0.18);
        }

        .net-worth-card::after {
            content: "";
            position: absolute;
            inset: auto -12% -42% auto;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(14,165,233,0.35), transparent 70%);
            pointer-events: none;
        }

        .wallet-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
            position: relative;
            z-index: 1;
        }

        .wallet-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text-main);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .wallet-badge::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(135deg, #67e8f9, #60a5fa);
            box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.18);
        }

        .wallet-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--emerald);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .wallet-status::before {
            content: "▲";
            font-size: 9px;
        }

        .net-worth-card h2 {
            position: relative;
            z-index: 1;
            font-size: 40px;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin: 8px 0 18px;
            color: var(--text-main);
            line-height: 1;
            text-shadow: var(--text-shadow);
        }

        .wallet-meta {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-top: 2px;
        }

        .wallet-meta-item {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 10px 12px;
        }

        .wallet-meta-item span {
            display: block;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .wallet-meta-item strong {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }

        .distribution-bar {
            position: relative;
            z-index: 1;
            height: 6px;
            width: 100%;
            border-radius: 10px;
            background: rgba(255,255,255,0.08);
            overflow: hidden;
            display: flex;
            gap: 2px;
            margin-top: 18px;
        }

        .distribution-bar > div {
            transition: width 0.7s var(--ease-out), background-color 0.4s ease;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0s !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="top-bar">
                <div class="brand-info">
                    <div class="brand-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V11"/><path d="M7 11h10"/></svg>
                    </div>
                    <div>
                        <span style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px;">Vault Balance</span>
                        <h1 style="font-size: 14px; font-weight: 700;">Azzer Wallet</h1>
                    </div>
                </div>

                <div class="menu-wrap" id="menuWrap">
                    <button class="icon-btn" id="menuBtn" onclick="toggleMenu(event)" title="Menu" aria-haspopup="true" aria-expanded="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.5"/><path d="M12 10v9"/><path d="M9 12h6"/><path d="M12 21v-2"/></svg>
                    </button>
                    <div class="dropdown" id="dropdownMenu" role="menu">
                        <button class="dropdown-item" role="menuitem" onclick="menuAction(togglePrivacy)">
                            <svg id="privacySvg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <span id="privacyLabel">Hide Balances</span>
                        </button>
                        <button class="dropdown-item" role="menuitem" onclick="menuAction(() => openModal('themeModal'))">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2"/><path d="M12 21v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M1 12h2"/><path d="M21 12h2"/><path d="m4.93 19.07 1.41-1.41"/><path d="m17.66 6.34 1.41-1.41"/></svg>
                            <span>Theme</span>
                        </button>
                        <button class="dropdown-item" role="menuitem" onclick="menuAction(exportCSV)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
                            <span>Export CSV</span>
                        </button>
                        <button class="dropdown-item" id="installItem" role="menuitem" hidden onclick="menuAction(installApp)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M9 7h6"/><path d="M12 18v-5"/><path d="m9.5 15.5 2.5 2.5 2.5-2.5"/></svg>
                            <span>Install App</span>
                        </button>
                        <div class="dropdown-sep"></div>
                        <button class="dropdown-item danger" role="menuitem" onclick="menuAction(confirmReset)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
                            <span>Reset Data</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="tab-nav">
                <span class="tab-indicator"></span>
                <button class="tab-btn active" onclick="switchTab('dashboard', this)">Dashboard</button>
                <button class="tab-btn" onclick="switchTab('accounts', this)">Accounts</button>
                <button class="tab-btn" onclick="switchTab('analytics', this)">Analytics</button>
                <button class="tab-btn" onclick="switchTab('bills', this)">Bills & IOU</button>
            </div>

            <div class="glass-card net-worth-card">
                <div class="wallet-card-header">
                    <span class="wallet-badge">Main Wallet</span>
                    <span class="wallet-status">+12.8%</span>
                </div>

                <p style="font-size: 12px; font-weight: 500; color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase; position: relative; z-index: 1;">Total Net Worth</p>
                <h2 id="totalBalance" class="balance-text">₱0.00</h2>

                <div class="wallet-meta">
                    <div class="wallet-meta-item">
                        <span>Cash</span>
                        <strong>₱18,240</strong>
                    </div>
                    <div class="wallet-meta-item">
                        <span>Invested</span>
                        <strong>₱24,680</strong>
                    </div>
                </div>

                <div class="distribution-bar" id="distributionBar"></div>
            </div>

            <div class="grid-actions">
                <button class="btn-action btn-primary-action" onclick="openModal('addTransactionModal')">+ Log</button>
                <button class="btn-action btn-secondary-action" onclick="openModal('quickUpdateModal')">Update All</button>
                <button class="btn-action btn-outline-action" onclick="openModal('transferModal')">Transfer</button>
            </div>
        </header>

        <main>
            <div id="tab-dashboard" class="tab-pane active">
                <div class="glass-card goals-card">
                    <div class="section-title" style="margin-bottom: -4px;">
                        <span>Monthly Cash Flow</span>
                        <span id="cashFlowNetBadge" style="font-size: 11px; font-weight: 800; color: var(--emerald); font-family: inherit;">+₱0.00 Net</span>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px;">
                        <div style="background: rgba(48, 209, 88, 0.1); border: 1px solid rgba(48, 209, 88, 0.25); border-radius: 18px; padding: 12px 14px;">
                            <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 4px;">
                                <div style="width: 8px; height: 8px; border-radius: 50%; background: var(--emerald);"></div>
                                <span style="font-size: 11px; font-weight: 600; color: var(--text-muted);">Income In</span>
                            </div>
                            <h4 id="cashFlowIncome" class="balance-text" style="font-size: 16px; font-weight: 800; color: var(--emerald);">₱0.00</h4>
                        </div>

                        <div style="background: rgba(255, 69, 58, 0.1); border: 1px solid rgba(255, 69, 58, 0.25); border-radius: 18px; padding: 12px 14px;">
                            <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 4px;">
                                <div style="width: 8px; height: 8px; border-radius: 50%; background: var(--rose);"></div>
                                <span style="font-size: 11px; font-weight: 600; color: var(--text-muted);">Expense Out</span>
                            </div>
                            <h4 id="cashFlowExpense" class="balance-text" style="font-size: 16px; font-weight: 800; color: var(--rose);">₱0.00</h4>
                        </div>
                    </div>
                </div>

                <div class="glass-card goals-card">
                    <div class="section-title" style="margin-bottom: -4px;">
                        <span>Monthly Goals Tracker</span>
                        <button onclick="openModal('goalsModal')" style="background: none; border: none; color: var(--primary); font-size: 11px; font-weight: 700; cursor: pointer;">Edit Targets</button>
                    </div>

                    <div class="goal-item">
                        <div class="goal-header">
                            <span>Monthly Spending Target</span>
                            <span id="spendGoalStatus" class="balance-text" style="font-size: 12px; font-weight: 700;">₱0 / ₱0</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div id="spendProgressBar" class="progress-bar-fill" style="width: 0%; background: var(--rose);"></div>
                        </div>
                    </div>

                    <div class="goal-item">
                        <div class="goal-header">
                            <span>Emergency Fund Goal</span>
                            <span id="saveGoalStatus" class="balance-text" style="font-size: 12px; font-weight: 700;">₱0 / ₱0</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div id="saveProgressBar" class="progress-bar-fill" style="width: 0%; background: var(--primary);"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast"></div>
    <script>
        const totalBalanceEl = document.getElementById('totalBalance');
        const distributionBar = document.getElementById('distributionBar');

        function renderDistributionBar(segments) {
            distributionBar.innerHTML = '';
            if (!segments || !segments.length) return;
            segments.forEach(seg => {
                const el = document.createElement('div');
                el.style.width = seg.width + '%';
                el.style.background = seg.color;
                distributionBar.appendChild(el);
            });
        }

        renderDistributionBar([
            { width: 58, color: '#0ea5e9' },
            { width: 28, color: '#34d399' },
            { width: 14, color: '#f59e0b' }
        ]);

        function formatMoney(value) {
            return new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP', minimumFractionDigits: 2 }).format(value);
        }

        function updateBalance() {
            totalBalanceEl.textContent = formatMoney(42980.25);
        }

        updateBalance();
    </script>
</body>
</html>
